services:
  app:
    image: italiano:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - aula-data:/app/learn/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  aula-data:
  caddy-data:
  caddy-config:
