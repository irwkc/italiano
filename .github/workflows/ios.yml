name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    name: Simulator
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml
          test -d Aula.xcodeproj

      - name: Simulator destination
        id: sim
        run: |
          python3 <<'PY'
          import json, os, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "-j"], text=True)
          data = json.loads(raw)
          names = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      names.append(d["name"])
          prefer = ["iPhone 16", "iPhone 16 Plus", "iPhone 15", "iPhone 15 Pro", "iPhone 14"]
          chosen = next((n for n in prefer if n in names), names[0] if names else "")
          if not chosen:
              raise SystemExit("no iPhone simulator")
          print(f"Using {chosen}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"name={chosen}\n")
          PY

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Aula.xcodeproj \
            -scheme Aula \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            test

      - name: Screenshot server
        run: |
          mkdir -p screenshots
          python3 scripts/screenshot_server.py --port 47321 --out "$PWD/screenshots" > /tmp/aula-shot-server.log 2>&1 &
          echo $! > /tmp/aula-shot-server.pid
          sleep 1

      - name: Simulator screenshots
        run: |
          set -o pipefail
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b
          xcrun simctl ui "${{ steps.sim.outputs.name }}" appearance light || true
          xcodebuild \
            -project Aula.xcodeproj \
            -scheme AulaMock \
            -only-testing:AulaUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath "$PWD/ScreenshotResults.xcresult" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            SCREENSHOT_UPLOAD_URL=http://127.0.0.1:47321 \
            SIMCTL_CHILD_SCREENSHOT_UPLOAD_URL=http://127.0.0.1:47321 \
            test
          ls -la screenshots
          test -f screenshots/login.png
          test -f screenshots/invite.png
          test -f screenshots/live.png
          test -f screenshots/quiz.png
          test -f screenshots/orario.png
          test -f screenshots/compiti.png

      - name: Stop screenshot server
        if: always()
        run: |
          kill "$(cat /tmp/aula-shot-server.pid)" 2>/dev/null || true
          cat /tmp/aula-shot-server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/screenshots/*.png
          if-no-files-found: warn
