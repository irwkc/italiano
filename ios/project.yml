name: Aula
options:
  bundleIdPrefix: ru.giacomoschiavon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
    AULA_USE_MOCK: NO
    AULA_API_BASE_URL: "https:/$()/giacomoschiavon.ru/api/mobile/v1"
schemes:
  Aula:
    build:
      targets:
        Aula: all
        AulaTests: [test]
    run:
      config: Debug
      environmentVariables:
        AULA_USE_MOCK: NO
    test:
      gatherCoverageData: false
      targets:
        - AulaTests
  AulaMock:
    build:
      targets:
        Aula: all
        AulaTests: [test]
    run:
      config: Debug
      environmentVariables:
        AULA_USE_MOCK: YES
    test:
      gatherCoverageData: false
      targets:
        - AulaTests
targets:
  Aula:
    type: application
    platform: iOS
    sources:
      - path: Aula
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.giacomoschiavon.aula
        PRODUCT_NAME: Aula
        DISPLAY_NAME: Aula
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Aula/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Aula
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Aula/Aula.entitlements
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Aula/Info.plist
      properties:
        CFBundleDisplayName: Aula
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchIvory
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Resources/Fonts/Italianno-Regular.ttf
          - Resources/Fonts/CormorantGaramond.ttf
        AULA_API_BASE_URL: "$(AULA_API_BASE_URL)"
        AULA_USE_MOCK: "$(AULA_USE_MOCK)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Aula/Aula.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)ru.giacomoschiavon.aula"
        aps-environment: development
  AulaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AulaTests
    dependencies:
      - target: Aula
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.giacomoschiavon.aula.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aula.app/Aula"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
